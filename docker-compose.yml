services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  backend:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      # Local-only: trust the antivirus TLS-inspection root (see certs/, git-ignored).
      # Remove these 3 lines and the certs volume on a machine without interception.
      SSL_CERT_FILE: /certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /certs/ca-bundle.pem
      CURL_CA_BUNDLE: /certs/ca-bundle.pem
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./corpus:/app/corpus
      - ./certs:/certs:ro
